name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-plan:
    name: Decide verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI reuse boundaries
        run: node --test .github/scripts/ci-reuse.test.mjs
      - name: Check successful PR tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-reuse.mjs decide

  msrv:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - name: Test declared MSRV
        run: cargo test --all-features --all-targets

  rust:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Test core only
        run: cargo test --no-default-features --all-targets
      - name: Test default features
        run: cargo test --all-targets
      - name: Test all features
        run: cargo test --all-features --all-targets
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: |
          cargo generate-lockfile
          cargo audit

  verified-tree:
    name: Record verified PR tree
    needs: [verify-plan, msrv, rust]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source tree
        run: node .github/scripts/ci-reuse.mjs record
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tested-tree/receipt.json
          retention-days: 14
          if-no-files-found: error
